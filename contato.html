<!DOCTYPE HTML>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Contato - Site da Empresa</title>
	<link href="Contato.css" rel="stylesheet">
</head>
<body id="bd-contacto">

	<div id="site">
		<header id="cabecalho" class="grupo">
			<a href="index.html" id="logo">
				<img src="imagens/logo_empresa.png" alt="Logomarca da Empresa">
			</a>
			<nav id="menu-principal">
				<ul class="grupo">
					<li><a href="index.html">Home</a></li>
					<li><a href="empresa.html">Empresa</a></li>
					<li><a href="produtos.html">Produtos</a></li>
					<li><a href="servicos.html">Serviços</a></li>
					<li><a class="ativo" href="contato.html">Contato</a></li>
				</ul>
			</nav>
		</header>

		<div id="foto-principal"></div>

		<main id="conteudo" class="grupo">
			<section id="conteudo-principal">
				<h1>Contato</h1>

				<p>Entre em contato conosco preenchendo o formulário abaixo:</p>

				<form action="#" method="post" novalidate>
					<fieldset>

						<fieldset class="grupo">
							<div class="campo nome">
								<label for="nome">Nome <abbr title="preenchimento obrigatório">*</abbr></label>
								<input type="text" name="nome" id="nome" maxlength="100" required>
							</div>

							<div class="campo empresa">
								<label for="empresa">Empresa</label>
								<input type="text" name="empresa" id="empresa" maxlength="100">
							</div>
						</fieldset>

						<div class="campo">
							<label for="email">E-mail <abbr title="preenchimento obrigatório">*</abbr></label>
							<input type="email" name="email" id="email" maxlength="100" required>
						</div>

						<fieldset class="grupo">
							<div class="campo telefone">
								<label for="telefone">Telefone <abbr title="preenchimento obrigatório">*</abbr></label>
								<input type="tel" name="telefone" id="telefone" maxlength="20" required>
							</div>

							<div class="campo">
								<label>Departamento</label>
								<label class="checkbox">
									<input type="radio" name="departamento" value="comercial"> Comercial
								</label>
								<label class="checkbox">
									<input type="radio" name="departamento" value="financeiro"> Financeiro
								</label>
								<label class="checkbox">
									<input type="radio" name="departamento" value="suporte"> Suporte
								</label>
							</div>
						</fieldset>

						<div class="campo">
							<label for="assunto">Assunto <abbr title="preenchimento obrigatório">*</abbr></label>
							<select id="assunto" name="assunto" required>
								<option value="" disabled selected>-- Selecione --</option>
								<option value="orcamento">Orçamento</option>
								<option value="duvidas">Dúvidas</option>
								<option value="solicitacoes">Solicitações</option>
								<option value="reclamacoes">Reclamações</option>
								<option value="outro">Outro</option>
							</select>
						</div>

						<div class="campo">
							<label for="mensagem">Mensagem <abbr title="preenchimento obrigatório">*</abbr></label>
							<textarea id="mensagem" name="mensagem" rows="6" required></textarea>
						</div>

						<div class="campo">
							<label class="checkbox">
								<input type="checkbox" name="newsletter" value="sim"> Gostaria de receber a Newsletter da Empresa
							</label>
						</div>

						<input type="submit" name="submit" class="submit" value="Enviar mensagem">

					</fieldset>
				</form>

			</section>
		</main>

		<footer id="rodape-fora">
			<div id="rodape" class="grupo">
				<p id="telefone-email">
					abcdef@gmail.com
					<br>
					<span class="ddd">+351</span> 92xxxxxxxx
				</p>

				<p id="endereco">
					Rua do Gen. Torres s/n
					<br>
					4430 - 189 Vila Nova de Gaia
					<br>
					4430-999 Vila Nova de Gaia, PT
				</p>

				<small id="copyright">
					&copy; Empresa Ltda. Todos os direitos reservados.
				</small>
			</div>
		</footer>
	</div>

</body>
</html>
